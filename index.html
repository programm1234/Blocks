<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blocks!</title>
        <style>
            body, html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden; /* Verhindert, dass man scrollen kann */
                background-color: #000000;
                color: white;
            }

            canvas {
                display: block; /* Wichtig, damit keine Lücke unter dem Canvas entsteht */
            }

            #gameContainer {
                position: relative;
                display: inline-block;
            }
            
            #Button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            display: none; /* Hidden until needed */

            z-index: 10;
            padding: 12px 24px;
            font-size: 18px;
            }
        </style>
    </head>
    <body>
        <div id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            <button id="Button">Restart</button>
        </div>
        <script type="module" src="main.js"></script>

    </body>
</html>
