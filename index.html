<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blocks!</title>
        <style>
            body, html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden; /* kein scrollen */
                background-color: #000000;
                color: white;
            }

            canvas {
                display: block; /* keine Lücke */
            }

            div {
                position: relative;
                display: inline-block;
            }

            #Button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            display: none;

            z-index: 10;
            padding: 12px 24px;
            font-size: 18px;
            }
        </style>
    </head>
    <body>
        <div>
            <canvas id="gameCanvas"></canvas>
            <button id="Button"></button>
        </div>
        <script type="module" src="main.js"></script>

    </body>
</html>
